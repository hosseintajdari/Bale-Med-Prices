name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Fixes #45: pinned to the same Node 24 as the Dockerfile.
          node-version: "24"

      # Fixes #45: install from the lockfile (validates package-lock.json is
      # in sync) before running the suite.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
