name: Backup source to Google Drive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drive-backup-${{ github.repository }}
  cancel-in-progress: false

jobs:
  backup:
    # The job is deliberately inactive until the Drive credential is configured.
    if: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON != '' }}
    runs-on: ubuntu-latest
    env:
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      DRIVE_ROOT_ID: "1CNtQHfZZOD96LZmexhd4mQ1li3XRdiWM"

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install --yes rclone

      - name: Configure restricted Drive access
        shell: bash
        run: |
          set -euo pipefail
          config_dir="$RUNNER_TEMP/rclone"
          mkdir -p "$config_dir"
          printf '%s' "$GDRIVE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/service-account.json"
          cat > "$config_dir/rclone.conf" <<EOF
          [drive]
          type = drive
          scope = drive
          service_account_file = $RUNNER_TEMP/service-account.json
          root_folder_id = $DRIVE_ROOT_ID
          EOF

      - name: Update current source mirror
        shell: bash
        run: |
          set -euo pipefail
          rclone sync "$GITHUB_WORKSPACE/" drive:current \
            --config "$RUNNER_TEMP/rclone/rclone.conf" \
            --exclude ".git/**" \
            --create-empty-src-dirs

      - name: Save immutable source snapshot
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/${{ github.event.repository.name }}-${{ github.sha }}.zip"
          git archive --format=zip --output "$archive" "$GITHUB_SHA"
          rclone copyto "$archive" "drive:snapshots/${{ github.sha }}.zip" \
            --config "$RUNNER_TEMP/rclone/rclone.conf"
