<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>قیمت دارو</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="hero">
        <p class="eyebrow">قیمت مصرف‌کننده</p>
        <h1>قیمت دارو را سریع و شفاف پیدا کنید</h1>
        <p class="hero-copy">
          نام دارو را به فارسی یا انگلیسی جستجو کنید، شکل و دوز را انتخاب کنید، و قیمت هر
          واحد مصرف را ببینید.
        </p>
      </section>

      <section class="workspace">
        <aside class="panel panel-search">
          <label class="field">
            <span class="field-label">جستجوی دارو</span>
            <input
              id="search-input"
              class="text-input"
              placeholder="نام دارو به فارسی یا انگلیسی"
              autocomplete="off"
            />
          </label>

          <p id="search-status" class="status-text" aria-live="polite"></p>
          <div id="search-results" class="search-results"></div>
        </aside>

        <section class="panel panel-pricing">
          <div class="panel-heading">
            <h2>نتیجه قیمت</h2>
            <p>پس از انتخاب دارو، قیمت هر واحد مصرف اینجا نمایش داده می‌شود.</p>
          </div>

          <form id="pricing-form" class="pricing-form">
            <input id="good-id" name="goodId" type="hidden" />

            <label class="field">
              <span class="field-label">تاریخ</span>
              <input
                id="document-date"
                name="documentDate"
                class="text-input"
                value="2026-06-24"
              />
            </label>

            <label class="field">
              <span class="field-label">تعداد</span>
              <input
                id="quantity"
                name="quantity"
                class="text-input"
                type="number"
                min="1"
                value="1"
              />
            </label>

            <button id="recalculate-button" class="primary-button" type="submit" disabled>
              بروزرسانی قیمت
            </button>
            <button id="reset-button" class="secondary-button" type="button">
              شروع دوباره
            </button>
          </form>

          <div id="selected-good" class="selected-good is-hidden"></div>
          <p id="pricing-status" class="status-text" aria-live="polite"></p>
          <div id="form-hints" class="hint-list"></div>
          <div id="pricing-result" class="result-grid"></div>
        </section>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
