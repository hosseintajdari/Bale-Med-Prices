services:
  api:
    build: .
    ports:
      - "${PORT:-4000}:4000"
    env_file:
      # Production keeps the real bot secrets in .secrets/ (server-local,
      # never in git); local dev uses the .env.* files. All optional —
      # whichever exist are loaded.
      - path: .secrets/telegram.env
        required: false
      - path: .secrets/bale.env
        required: false
      - path: .env.telegram
        required: false
      - path: .env.bale
        required: false
    environment:
      PORT: 4000
      API_BASE_URL: ${API_BASE_URL:-http://127.0.0.1:4000}
      # Darukade price catalog (public prices, harvested on the host by the
      # scraper cron). Mounted READ-ONLY: the API never writes the catalog,
      # and no per-pharmacy data is ever mounted into this service.
      DARUKADE_DB_PATH: /app/data/scrapers/darukade.sqlite3
      QANUN_GOODS_PATH: /app/data/scrapers/qanun-goods.json
      # Read-only REST complement dataset (rest_cycle.py). Merged fill-only
      # by the API; absent file = primary catalog alone.
      REST_GOODS_PATH: /app/data/scrapers/rest-goods.json
    volumes:
      - ${DARUKADE_DATA_DIR:-/home/admin/scrapers/data}:/app/data/scrapers:ro
    restart: unless-stopped
